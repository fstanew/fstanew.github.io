<html lang="pl">
<head>

    <title>Moje Auta Flask</title>

        body { font-family: sans-serif; margin: 30px; line-height: 1.6; }
        nav { margin-bottom: 20px; background: #eee; padding: 10px; }

        th { background: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; border: 1px solid #000; color: #000; }

<body>
    <nav>
        <strong>🚗 AutoManager Flask</strong> | 
        <a href="{{ url_for('index') }}">Strona Główna</a>
    </nav>
    <div class="container">
        {% block content %} {% endblock %}
    </div>
</body>
</html>
